name: Migrate Product Lists to JSON

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/migrate-product-lists-to-json.mjs
      - .github/workflows/migrate-product-lists-json.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[product-json]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Migrate product lists
        run: node scripts/migrate-product-lists-to-json.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mama-products.json data/swim-products.json lib/mama-products.ts lib/swim-products.ts
          git commit -m "Move product lists to JSON [product-json]"
          git push origin HEAD:refactor/archive-products-cleanup
