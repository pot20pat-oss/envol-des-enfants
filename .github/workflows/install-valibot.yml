name: Install Valibot

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - .github/workflows/install-valibot.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install Valibot and update lockfile
        run: npm install valibot@1.4.2 --save --save-exact

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Valibot 1.4.2"
          git push origin HEAD:refactor/archive-products-cleanup
