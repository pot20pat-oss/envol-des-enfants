name: Migrate Default Products to JSON

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/migrate-default-inline-products-to-json.mjs
      - .github/workflows/migrate-default-products-json.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[default-json]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Migrate default product data
        run: node scripts/migrate-default-inline-products-to-json.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default-products.json lib/default-catalog.ts
          git commit -m "Move inline default product data to JSON [default-json]"
          git push origin HEAD:refactor/archive-products-cleanup
