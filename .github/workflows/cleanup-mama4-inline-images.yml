name: Cleanup Mama4 inline images

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/cleanup-mama4-inline-images.mjs
      - .github/workflows/cleanup-mama4-inline-images.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-mama4]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Remove unused inline images
        run: node scripts/cleanup-mama4-inline-images.mjs

      - name: Commit cleaned data
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mama4-products-*.ts
          git commit -m "Remove unused inline Mama4 images [cleanup-mama4]"
          git push origin HEAD:refactor/archive-products-cleanup
