name: Refactor admin data

on:
  push:
    branches:
      - refactor/admin-data-hook

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-data-hook
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refactor-admin-data.mjs
      - name: Commit transformed admin
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git commit -m "Raccorder le chargement admin au hook dédié"
          git push origin HEAD:refactor/admin-data-hook
