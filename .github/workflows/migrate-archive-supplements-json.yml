name: Migrate Archive Supplements to JSON

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/migrate-archive-supplements-to-json.mjs
      - .github/workflows/migrate-archive-supplements-json.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[archive-json]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Migrate archive supplement data
        run: node scripts/migrate-archive-supplements-to-json.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive-supplement-products.json lib/default-catalog.ts
          git commit -m "Move archive supplement product data to JSON [archive-json]"
          git push origin HEAD:refactor/archive-products-cleanup
