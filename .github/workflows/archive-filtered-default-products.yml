name: Archive Filtered Default Products

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/archive-filtered-default-products.mjs
      - .github/workflows/archive-filtered-default-products.yml

permissions:
  contents: write

jobs:
  archive:
    if: ${{ !contains(github.event.head_commit.message, '[filtered-defaults-archived]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Archive runtime-filtered defaults
        run: node scripts/archive-filtered-default-products.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/default-products.json data/legacy-default-products-without-images.json
          git commit -m "Archive runtime-filtered default products [filtered-defaults-archived]"
          git push origin HEAD:refactor/archive-products-cleanup
