name: Migrate Catalog Metadata to JSON

on:
  push:
    branches:
      - refactor/archive-products-cleanup
    paths:
      - scripts/migrate-catalog-metadata-to-json.mjs
      - .github/workflows/migrate-catalog-metadata-json.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-meta-json]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/archive-products-cleanup

      - name: Migrate catalog metadata
        run: node scripts/migrate-catalog-metadata-to-json.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/removed-product-names.json data/legacy-removed-product-objects.json data/reference-prices.json lib/default-catalog.ts
          git commit -m "Move catalog metadata to JSON [catalog-meta-json]"
          git push origin HEAD:refactor/archive-products-cleanup
